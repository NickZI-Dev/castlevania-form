<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Castlevania - Formulário</title>
  <link rel="shortcut icon" href="./img/icons/grave.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./build/main.css">
</head>

<body>
  <header class="container pt-4 pb-5">
    <h1>
      Bem-Vindo a Castlevania!
    </h1>
  </header>
  <main>
    <div class="container">
      <div class="row form-contato pt-lg-5">
        <div class="col-md-10 col-lg-8">
          <form id="#form">
            <div>
              <label for="nome" class="form-label fs-2">Nome completo:</label>
              <input type="text" class="form-control mb-2 fs-4" id="nome" name="nome" placeholder="Trevor Belmont">
            </div>
            <div>
              <label for="email" class="form-label fs-2">Seu e-mail:</label>
              <input type="email" id="email" class="form-control mb-2 fs-4" name="email" placeholder="trev0rBelmont@hotmail.com">
            </div>
            <div>
              <label for="telefone" class="form-label fs-2">Telefone(Opcional):</label>
              <input type="tel" id="telefone" class="form-control mb-2 fs-4" name="telefone">
            </div>
            <div>
              <label for="mensagem" class="form-label fs-2">Adicione sua mensagem:</label>
              <textarea id="mensagem" class="form-control mb-3 fs-4" name="mensagem" placeholder="Bravo herói! Sua sugestão é de extrema importância"></textarea>
            </div>
            <div class="form-check form-switch">
              <label for="aceitar-termos" class="form-check-label">Li e concordo com os termos de uso</label>
              <input type="checkbox" id="aceitar-termos" class="form-check-input d-block">
            </div>
            <button type="submit" class="fs-3 btn btn-primary rounded">Cadastrar</button>
          </form>
        </div>
      </div>
    </div>
  </main>


  <script src="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="./lib/jquery - plugins/jquery.mask.min.js"></script>
  <script src="./lib/jquery - plugins/jquery.validate.min.js"></script>
  <script src="./lib/jquery - plugins/messages_pt_BR.min.js"></script>
  <script src="./main.js"></script>
</body>

</html>
